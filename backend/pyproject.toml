[tool.pytest.ini_options]
# pytest-django: https://github.com/pytest-dev/pytest-django/blob/main/docs/configuring_django.rst
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tests", "hospitals/tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]  # generated by Django makemigrations
target-version = "py312"

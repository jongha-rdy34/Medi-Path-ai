# symptom-care docker compose (공동 소유 파일: 바꾸면 상대방 리뷰 필수)
#
# 실행 (저장소 루트에서):
#   cp .env.example .env
#   docker compose --env-file .env -f infra/docker-compose.yml --profile core up --build
#
# 키 전달
#   backend : env_file(../.env)로 DATA_GO_KR_SERVICE_KEY, KAKAO_REST_API_KEY 등 서버 값을 모두 받습니다.
#   frontend: VITE_KAKAO_MAP_JS_KEY 하나만 받습니다(서버 키는 넘기지 않음). 값은 `--env-file .env`로 치환됩니다.
#   치환 규칙: https://github.com/docker/docs/blob/main/content/manuals/compose/how-tos/environment-variables/variable-interpolation.md
#
# 프로필
#   core     : 상시 공개용(frontend, backend, ml-service, postgres). 병원 검색은 Kakao 로컬 API(T21)라 ES가 필요 없습니다.
#   pipeline : Elasticsearch(심평원 병원·응급실 병상, T60). Kafka/Flink/Spark/Airflow는 T53, T60~T62에서 추가합니다.
#
# 참고
#   - 프로필: https://github.com/compose-spec/compose-spec/blob/main/15-profiles.md
#   - Elasticsearch Docker 설정(환경변수, ES_JAVA_OPTS):
#     https://github.com/elastic/docs-content/blob/main/deploy-manage/deploy/self-managed/install-elasticsearch-docker-configure.md

name: symptom-care

x-env: &env
  env_file: ../.env

services:
  frontend:
    profiles: [core]
    build: ../frontend
    environment:
      # Vite는 실행 시점의 환경변수를 .env 파일보다 우선합니다(vitejs/vite docs/guide/env-and-mode.md).
      VITE_KAKAO_MAP_JS_KEY: ${VITE_KAKAO_MAP_JS_KEY:-}
      # 개발 서버가 /api를 백엔드 컨테이너로 넘깁니다(frontend/vite.config.ts server.proxy).
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    profiles: [core]
    build: ../backend
    <<: *env
    environment:
      POSTGRES_HOST: postgres
      ML_SERVICE_URL: http://ml-service:8001
      MAPPINGS_DIR: /app/data/mappings
    volumes:
      # 질환·진료과 매핑(T11). 결과의 질환명·권장 진료과에 씁니다.
      - ../data/mappings:/app/data/mappings:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  ml-service:
    profiles: [core]
    build: ../ml-service
    environment:
      MODEL_DIR: /app/models
      MODEL_VERSION: ${MODEL_VERSION:-dropout-2026.11.0}
      MAPPINGS_DIR: /app/data/mappings
      # LLM (ADR 0001). 키가 없으면 /llm/*는 503 llm_unavailable입니다.
      # 클라우드 세션에서는 네트워크 프록시가 진짜 키를 넣으므로 아무 값이나 넣어도 됩니다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      LLM_CANDIDATE_K: ${LLM_CANDIDATE_K:-30}
    volumes:
      # 학습한 모델 파일(gitignore 대상). 만들기: cd ml-service && python -m triage.train
      # (기본 dropout-2026.11.0, 시드 고정이라 같은 데이터면 같은 모델)
      # 모델이 없으면 /health는 200, /predict는 503 model_not_loaded를 돌려줍니다.
      - ../ml-service/models:/app/models:ro
      # 증상 사전(LLM 프롬프트)
      - ../data/mappings:/app/data/mappings:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    profiles: [core]
    image: postgres:17.11-alpine
    <<: *env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    profiles: [pipeline]
    image: elasticsearch:9.4.8
    environment:
      discovery.type: single-node
      # 로컬 개발 전용. 배포에서는 포트를 외부에 열지 않고 내부 네트워크로만 접근합니다.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      # 단일 노드 개발용: 호스트 디스크 사용률이 90%를 넘으면 샤드가 배정되지 않아 클러스터가 red가 됩니다.
      # 디스크가 작은 배포 VM에서는 T31에서 이 값을 다시 판단합니다.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  # --- pipeline 프로필: 위 elasticsearch 외 서비스는 자리만 확보 ---------------
  # kafka, flink-jobmanager, flink-taskmanager, spark, airflow 서비스를 여기에 추가하고
  # 각 서비스에 `profiles: [pipeline]`을 붙입니다. (T53, T60, T61, T62)

volumes:
  postgres-data:
  es-data:

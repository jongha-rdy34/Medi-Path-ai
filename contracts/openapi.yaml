openapi: 3.1.0
info:
  title: Symptom Care API
  version: 0.1.0
  summary: 증상 기반 진료과·병원 안내 서비스 공개 API (v0)
  description: |
    증상 기반 진료과·병원 안내 서비스의 공개 API 계약입니다.
    프론트엔드(Mock), 백엔드, 계약 테스트가 모두 이 파일을 기준으로 합니다.

    ## 안전 원칙 (SPEC 6절)
    - 이 서비스의 결과는 **진단이 아니라 안내**입니다. 모든 결과에는 `disclaimer`가 포함됩니다.
    - 사용자가 보낸 원문 증상(`text`)은 **저장하지 않습니다.** 서버는 구조화 증상(표준 증상 ID)과 시군구 코드만 저장합니다.
    - 위급 신호가 감지되면 `emergency: true`와 `emergency_notice`가 함께 내려옵니다. 화면은 이를 다른 내용보다 먼저 보여 줘야 합니다.

    ## 공통 규칙
    - 로그인이 없습니다. 세션은 `session_id`(UUID)로만 식별합니다.
    - 오류 응답은 모두 `Error` 스키마를 씁니다.
    - 진료과 코드는 건강보험심사평가원 진료과목 코드(2자리 문자열)를 씁니다. 예: `01` 내과.
      코드표는 `data/mappings/departments.csv`(T11)에 둡니다.
servers:
  - url: http://localhost:8000
    description: 로컬 개발 (docker compose core 프로필)
security: []
tags:
  - name: triage
    description: 증상 입력, 추가 질문, 결과 조회
  - name: hospitals
    description: 주변 병원 검색
  - name: system
    description: 상태 확인
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 백엔드 상태 확인
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '503':
          description: 의존 서비스 이상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: 일시적으로 서비스를 사용할 수 없습니다.

  /api/triage/sessions:
    post:
      tags: [triage]
      operationId: createTriageSession
      summary: 세션 생성
      description: 증상 안내 대화를 시작합니다. 본문은 생략할 수 있습니다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            example:
              region_code: '11680'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                session_id: 3f1c2b7e-8a4d-4c6e-9b1a-2d5e7f9a0c11
                status: collecting
                created_at: '2026-11-18T09:00:00+09:00'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/triage/sessions/{session_id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [triage]
      operationId: postTriageMessage
      summary: 증상 메시지 전송
      description: |
        사용자의 자연어 증상(또는 추가 질문에 대한 답)을 보냅니다.
        응답 `status`는 둘 중 하나입니다.
        - `needs_more_info`: 추가 질문 1~3개가 있습니다. 답을 다시 이 엔드포인트로 보냅니다.
        - `result_ready`: `GET /api/triage/sessions/{session_id}/result`로 결과를 조회합니다.

        `text`는 처리에만 쓰고 저장하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
            example:
              text: 어제부터 열이 나고 배가 아프고 설사를 해요
      responses:
        '200':
          description: 처리됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                needsMoreInfo:
                  summary: 추가 질문이 필요한 경우
                  value:
                    status: needs_more_info
                    session_id: 3f1c2b7e-8a4d-4c6e-9b1a-2d5e7f9a0c11
                    structured_symptoms:
                      symptoms:
                        - symptom_id: high_fever
                          duration_days: 1
                        - symptom_id: abdominal_pain
                    questions:
                      - question_id: q1
                        text: 설사나 구토가 있나요?
                        choices: [설사, 구토, 둘 다, 없음]
                      - question_id: q2
                        text: 배의 어느 쪽이 가장 아픈가요?
                        choices: [윗배, 배꼽 주위, 오른쪽 아랫배, 왼쪽 아랫배, 배 전체]
                    emergency: false
                    emergency_notice: null
                resultReady:
                  summary: 결과가 준비된 경우
                  value:
                    status: result_ready
                    session_id: 3f1c2b7e-8a4d-4c6e-9b1a-2d5e7f9a0c11
                    structured_symptoms:
                      symptoms:
                        - symptom_id: high_fever
                          duration_days: 1
                        - symptom_id: abdominal_pain
                        - symptom_id: diarrhoea
                    result_url: /api/triage/sessions/3f1c2b7e-8a4d-4c6e-9b1a-2d5e7f9a0c11/result
                    emergency: false
                    emergency_notice: null
                emergency:
                  summary: 위급 신호가 감지된 경우
                  value:
                    status: result_ready
                    session_id: 7b2e4d1a-1c3f-4e5a-8b6d-0f9e8d7c6b5a
                    structured_symptoms:
                      symptoms:
                        - symptom_id: chest_pain
                          severity: severe
                        - symptom_id: breathlessness
                    result_url: /api/triage/sessions/7b2e4d1a-1c3f-4e5a-8b6d-0f9e8d7c6b5a/result
                    emergency: true
                    emergency_notice:
                      reasons: [가슴 통증과 호흡곤란이 함께 있습니다]
                      message: 지금 바로 119에 전화하거나 가까운 응급실로 가세요.
                      call_number: '119'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: 이미 결과가 확정된 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: session_completed
                message: 이 세션은 이미 결과가 확정됐습니다. 새 세션을 시작하세요.
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/triage/sessions/{session_id}/result:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [triage]
      operationId: getTriageResult
      summary: 결과 조회
      description: 가능성 있는 질환 Top-3(확률), 권장 진료과, 설명, 위급 여부를 돌려줍니다.
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResult'
              examples:
                normal:
                  summary: 일반 결과
                  value:
                    session_id: 3f1c2b7e-8a4d-4c6e-9b1a-2d5e7f9a0c11
                    emergency: false
                    emergency_notice: null
                    predictions:
                      - disease_id: gastroenteritis
                        disease_name_ko: 위장염
                        probability: 0.52
                      - disease_id: typhoid
                        disease_name_ko: 장티푸스
                        probability: 0.23
                      - disease_id: hepatitis_a
                        disease_name_ko: A형 간염
                        probability: 0.09
                    recommended_departments:
                      - code: '01'
                        name_ko: 내과
                        reason: 발열, 복통, 설사는 소화기 감염에서 흔한 증상이라 내과 진료를 권합니다.
                    explanation: 입력하신 발열, 복통, 설사 증상은 위장염에서 자주 나타납니다. 증상이 이틀 넘게 계속되거나 탈수 증상(소변량 감소, 어지럼)이 있으면 진료를 받으세요.
                    structured_symptoms:
                      symptoms:
                        - symptom_id: high_fever
                          duration_days: 1
                        - symptom_id: abdominal_pain
                        - symptom_id: diarrhoea
                    disclaimer: 이 결과는 의학적 진단이 아니며 참고용 안내입니다. 정확한 진단과 치료는 의료진에게 받으세요.
                    model_version: baseline-2026.11.0
                    created_at: '2026-11-18T09:01:30+09:00'
                emergency:
                  summary: 위급 신호 결과
                  value:
                    session_id: 7b2e4d1a-1c3f-4e5a-8b6d-0f9e8d7c6b5a
                    emergency: true
                    emergency_notice:
                      reasons: [가슴 통증과 호흡곤란이 함께 있습니다]
                      message: 지금 바로 119에 전화하거나 가까운 응급실로 가세요.
                      call_number: '119'
                    predictions:
                      - disease_id: heart_attack
                        disease_name_ko: 심근경색
                        probability: 0.61
                      - disease_id: pneumonia
                        disease_name_ko: 폐렴
                        probability: 0.14
                      - disease_id: gerd
                        disease_name_ko: 위식도역류질환
                        probability: 0.08
                    recommended_departments:
                      - code: '24'
                        name_ko: 응급의학과
                        reason: 가슴 통증과 호흡곤란이 함께 있으면 응급 평가가 필요합니다.
                    explanation: 가슴 통증과 호흡곤란이 함께 나타나면 심장이나 폐의 응급 질환일 수 있습니다. 결과를 기다리지 말고 응급실로 가세요.
                    structured_symptoms:
                      symptoms:
                        - symptom_id: chest_pain
                          severity: severe
                        - symptom_id: breathlessness
                    disclaimer: 이 결과는 의학적 진단이 아니며 참고용 안내입니다. 정확한 진단과 치료는 의료진에게 받으세요.
                    model_version: baseline-2026.11.0
                    created_at: '2026-11-18T09:05:10+09:00'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: 아직 결과가 준비되지 않음(추가 질문에 답이 필요)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: result_not_ready
                message: 추가 질문에 먼저 답해 주세요.

  /api/hospitals:
    get:
      tags: [hospitals]
      operationId: searchHospitals
      summary: 주변 병원 검색
      description: |
        좌표 기준 반경 안의 병원을 거리순으로 돌려줍니다. `department`를 주면 그 진료과가 있는 병원만 돌려줍니다.
        좌표는 검색에만 쓰고 저장하지 않습니다.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 37.4979
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 127.0276
        - name: department
          in: query
          required: false
          description: 심평원 진료과목 코드. 생략하면 진료과 필터 없이 검색합니다.
          schema:
            $ref: '#/components/schemas/DepartmentCode'
          example: '01'
        - name: radius
          in: query
          required: false
          description: 검색 반경(미터)
          schema:
            type: integer
            minimum: 100
            maximum: 20000
            default: 3000
          example: 3000
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      responses:
        '200':
          description: 거리순 병원 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalSearchResponse'
              example:
                total: 2
                items:
                  - hospital_id: EXAMPLE-0001
                    name: 예시내과의원
                    type: 의원
                    address: 서울특별시 강남구 예시로 1
                    phone: 02-000-0001
                    location:
                      lat: 37.4985
                      lng: 127.0281
                    distance_m: 78
                    departments: ['01', '23']
                    has_emergency_room: false
                  - hospital_id: EXAMPLE-0002
                    name: 예시종합병원
                    type: 종합병원
                    address: 서울특별시 강남구 예시로 2
                    phone: null
                    location:
                      lat: 37.5021
                      lng: 127.0352
                    distance_m: 812
                    departments: ['01', '04', '24']
                    has_emergency_room: true
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3f1c2b7e-8a4d-4c6e-9b1a-2d5e7f9a0c11

  responses:
    SessionNotFound:
      description: 세션이 없거나 만료됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: session_not_found
            message: 세션을 찾을 수 없습니다. 새 세션을 시작하세요.
    ValidationError:
      description: 요청 값이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_error
            message: 요청 값이 올바르지 않습니다.
            details:
              - field: text
                message: 1자 이상 500자 이하로 입력하세요.

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 기계가 읽는 오류 코드(snake_case)
        message:
          type: string
          description: 사용자에게 보여 줄 수 있는 한국어 메시지
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    RegionCode:
      type: string
      pattern: '^[0-9]{5}$'
      description: 시군구 코드(행정표준코드 앞 5자리). 지역 통계에만 쓰며, 이보다 자세한 위치는 저장하지 않습니다.

    DepartmentCode:
      type: string
      pattern: '^[0-9A-Z]{2}$'
      description: 건강보험심사평가원 진료과목 코드(2자리). 예 `01` 내과, `24` 응급의학과.

    SymptomId:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      description: 표준 증상 ID. `data/mappings/symptoms.csv`(T11)의 `symptom_id`와 같습니다.

    DiseaseId:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      description: 질환 ID. `data/mappings/disease_department.csv`(T11)의 `disease_id`와 같습니다.

    SymptomObservation:
      type: object
      description: 구조화된 증상 1개. 원문 대신 이것만 저장하고 모델에 보냅니다.
      required: [symptom_id]
      additionalProperties: false
      properties:
        symptom_id:
          $ref: '#/components/schemas/SymptomId'
        severity:
          type: string
          enum: [mild, moderate, severe]
        duration_days:
          type: integer
          minimum: 0
          description: 증상이 시작된 뒤 지난 일수(0 = 오늘)

    StructuredSymptoms:
      type: object
      description: LLM이 원문에서 추출한 구조화 증상. 개인 식별 정보는 들어가지 않습니다.
      required: [symptoms]
      additionalProperties: false
      properties:
        symptoms:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/SymptomObservation'

    EmergencyNotice:
      type: object
      description: 위급 신호 안내. 규칙 기반 체크 또는 LLM 중 하나라도 위급으로 판단하면 내려옵니다.
      required: [reasons, message, call_number]
      properties:
        reasons:
          type: array
          minItems: 1
          items:
            type: string
        message:
          type: string
        call_number:
          type: string
          enum: ['119']

    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        region_code:
          $ref: '#/components/schemas/RegionCode'

    Session:
      type: object
      required: [session_id, status, created_at]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SessionStatus'
        created_at:
          type: string
          format: date-time

    SessionStatus:
      type: string
      enum: [collecting, result_ready]

    MessageRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: 사용자의 자연어 증상 또는 추가 질문에 대한 답. 저장하지 않습니다.

    FollowUpQuestion:
      type: object
      required: [question_id, text]
      properties:
        question_id:
          type: string
        text:
          type: string
        choices:
          type: array
          description: 선택지가 있으면 버튼으로 보여 줍니다. 사용자는 자유롭게 답해도 됩니다.
          items:
            type: string

    MessageNeedsMoreInfo:
      type: object
      required: [status, session_id, structured_symptoms, questions, emergency, emergency_notice]
      properties:
        status:
          type: string
          const: needs_more_info
        session_id:
          type: string
          format: uuid
        structured_symptoms:
          $ref: '#/components/schemas/StructuredSymptoms'
        questions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/FollowUpQuestion'
        emergency:
          type: boolean
        emergency_notice:
          oneOf:
            - $ref: '#/components/schemas/EmergencyNotice'
            - type: 'null'

    MessageResultReady:
      type: object
      required: [status, session_id, structured_symptoms, result_url, emergency, emergency_notice]
      properties:
        status:
          type: string
          const: result_ready
        session_id:
          type: string
          format: uuid
        structured_symptoms:
          $ref: '#/components/schemas/StructuredSymptoms'
        result_url:
          type: string
        emergency:
          type: boolean
        emergency_notice:
          oneOf:
            - $ref: '#/components/schemas/EmergencyNotice'
            - type: 'null'

    MessageResponse:
      oneOf:
        - $ref: '#/components/schemas/MessageNeedsMoreInfo'
        - $ref: '#/components/schemas/MessageResultReady'
      discriminator:
        propertyName: status
        mapping:
          needs_more_info: '#/components/schemas/MessageNeedsMoreInfo'
          result_ready: '#/components/schemas/MessageResultReady'

    DiseasePrediction:
      type: object
      required: [disease_id, disease_name_ko, probability]
      properties:
        disease_id:
          $ref: '#/components/schemas/DiseaseId'
        disease_name_ko:
          type: string
        probability:
          type: number
          minimum: 0
          maximum: 1

    RecommendedDepartment:
      type: object
      required: [code, name_ko, reason]
      properties:
        code:
          $ref: '#/components/schemas/DepartmentCode'
        name_ko:
          type: string
        reason:
          type: string

    TriageResult:
      type: object
      required:
        - session_id
        - emergency
        - emergency_notice
        - predictions
        - recommended_departments
        - explanation
        - structured_symptoms
        - disclaimer
        - model_version
        - created_at
      properties:
        session_id:
          type: string
          format: uuid
        emergency:
          type: boolean
          description: true이면 화면은 119 안내를 다른 모든 내용보다 위에 표시합니다.
        emergency_notice:
          oneOf:
            - $ref: '#/components/schemas/EmergencyNotice'
            - type: 'null'
        predictions:
          type: array
          description: 확률이 높은 순서의 질환 최대 3개
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/DiseasePrediction'
        recommended_departments:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RecommendedDepartment'
        explanation:
          type: string
          description: LLM이 쓴 쉬운 설명. "진단" 표현을 쓰지 않습니다.
        structured_symptoms:
          $ref: '#/components/schemas/StructuredSymptoms'
        disclaimer:
          type: string
          description: 의료 고지 문구. 화면에 항상 표시합니다.
        model_version:
          type: string
        created_at:
          type: string
          format: date-time

    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    Hospital:
      type: object
      required: [hospital_id, name, type, address, phone, location, distance_m, departments, has_emergency_room]
      properties:
        hospital_id:
          type: string
          description: 심평원 암호화 요양기호(ykiho)
        name:
          type: string
        type:
          type: string
          description: 종별 이름. 예 의원, 병원, 종합병원, 상급종합
        address:
          type: string
        phone:
          type: [string, 'null']
        location:
          $ref: '#/components/schemas/LatLng'
        distance_m:
          type: integer
          minimum: 0
        departments:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentCode'
        has_emergency_room:
          type: boolean

    HospitalSearchResponse:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
          description: 반경 안에서 조건에 맞는 병원 수(`limit`과 무관)
        items:
          type: array
          items:
            $ref: '#/components/schemas/Hospital'

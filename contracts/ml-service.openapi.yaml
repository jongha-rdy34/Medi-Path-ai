openapi: 3.1.0
info:
  title: Symptom Care ml-service (internal)
  version: 0.3.0
  summary: 백엔드 → ml-service 내부 계약 (v0, T30에서 LLM·위급 판정 추가)
  description: |
    backend-api가 호출하는 triage-model 추론 서버(FastAPI)의 내부 계약입니다. 외부에 공개하지 않습니다.
    구조화 증상 스키마는 공개 계약(`openapi.yaml`)의 것을 그대로 참조합니다. 둘이 어긋나지 않게 하기 위해서입니다.

    - `/predict`, `/llm/questions`, `/llm/explain`, `/safety/check`의 입력은 구조화 증상(표준 증상 ID)뿐입니다.
    - **원문 문장은 `/llm/extract`만 받습니다.** 증상 구조화에만 쓰고 저장하거나 로그로 남기지 않습니다(SPEC 6절).
    - LLM 엔드포인트는 `GEMINI_MODEL`이 429·5xx로 실패하면 `GEMINI_FALLBACK_MODEL`로 다시 시도하고, 둘 다 실패하면 `503 llm_unavailable`을 돌려줍니다(ADR 0001).
    - 출력 확률은 내림차순이며 `top_k`개입니다. 질환 이름과 진료과 매핑은 백엔드가 `data/mappings`로 붙입니다.
servers:
  - url: http://ml-service:8001
    description: docker compose 내부 네트워크
security: []
tags:
  - name: inference
    description: 질환 확률 추론
  - name: llm
    description: LLM 증상 구조화·추가 질문·설명 (LLMProvider)
  - name: safety
    description: 규칙 기반 위급 신호 판정 (T15)
  - name: system
    description: 상태 확인
paths:
  /health:
    get:
      tags: [system]
      operationId: getMlHealth
      summary: ml-service 상태 확인
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: './openapi.yaml#/components/schemas/Health'
              example:
                status: ok
        '503':
          description: 모델 로드 실패 등
          content:
            application/json:
              schema:
                $ref: './openapi.yaml#/components/schemas/Error'
              example:
                code: model_not_loaded
                message: 모델이 아직 로드되지 않았습니다.

  /predict:
    post:
      tags: [inference]
      operationId: predict
      summary: 구조화 증상 → 질환 확률
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
            example:
              symptoms:
                - symptom_id: high_fever
                  duration_days: 1
                - symptom_id: abdominal_pain
                - symptom_id: diarrhoea
              top_k: 3
      responses:
        '200':
          description: 예측 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictResponse'
              example:
                model_version: baseline-2026.11.0
                predictions:
                  - disease_id: gastroenteritis
                    probability: 0.52
                  - disease_id: typhoid
                    probability: 0.23
                  - disease_id: hepatitis_a
                    probability: 0.09
                unknown_symptom_ids: []
        '422':
          description: 요청 값이 올바르지 않음(증상 없음, ID 형식 오류 등)
          content:
            application/json:
              schema:
                $ref: './openapi.yaml#/components/schemas/Error'
              example:
                code: validation_error
                message: 증상이 1개 이상 필요합니다.

  /llm/extract:
    post:
      tags: [llm]
      operationId: llmExtract
      summary: 자연어 증상 → 구조화 증상 + LLM 위급 의심
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
            example:
              text: 어제부터 열이 나고 기침과 누런 가래가 나와요
      responses:
        '200':
          description: 구조화 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
              example:
                symptoms:
                  - symptom_id: high_fever
                    duration_days: 1
                  - symptom_id: cough
                  - symptom_id: phlegm
                emergency_suspected: false
                emergency_reason: null
                model: gemini-3.5-flash-lite
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/LlmUnavailable'

  /llm/questions:
    post:
      tags: [llm]
      operationId: llmQuestions
      summary: 파악한 증상 → 추가 질문 0~3개
      description: 위험 요인(성 접촉, 주사·수혈 경로, 가족력)과 개인정보는 묻지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionsRequest'
            example:
              symptom_ids: [high_fever]
      responses:
        '200':
          description: 추가 질문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionsResponse'
              example:
                questions:
                  - question_id: q1
                    text: 열은 언제부터 났나요?
                    choices: [오늘, 1~2일 전, 3일 이상]
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/LlmUnavailable'

  /llm/explain:
    post:
      tags: [llm]
      operationId: llmExplain
      summary: 화면에 보일 질환과 증상 → 쉬운 설명
      description: 백엔드는 화면에서 숨긴 민감 질환을 `disease_names`에 넣지 않습니다. 설명에 "진단"이라는 말은 쓰지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
            example:
              disease_names: [폐렴, 기관지 천식, 감기]
              symptom_ids: [high_fever, cough, phlegm]
      responses:
        '200':
          description: 설명문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResponse'
              example:
                explanation: 열, 기침, 가래가 함께 있으면 폐렴이나 기관지 질환에서 흔히 나타납니다. 숨이 차거나 열이 사흘 넘게 이어지면 진료를 받으세요.
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/LlmUnavailable'

  /safety/check:
    post:
      tags: [safety]
      operationId: safetyCheck
      summary: 구조화 증상 → 규칙 기반 위급 판정 (T15)
      description: 백엔드는 이 결과와 `/llm/extract`의 `emergency_suspected`를 OR로 묶습니다(SPEC 6절).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyRequest'
            example:
              symptoms:
                - symptom_id: chest_pain
                - symptom_id: breathlessness
      responses:
        '200':
          description: 판정 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyResponse'
              example:
                is_emergency: true
                reasons: [가슴 통증이 있습니다. 증상만으로는 심장 원인을 배제할 수 없습니다.]
                rule_ids: [chest_pain]
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  responses:
    ValidationError:
      description: 요청 값이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: './openapi.yaml#/components/schemas/Error'
          example:
            code: validation_error
            message: 요청 값이 올바르지 않습니다.
    LlmUnavailable:
      description: 기본·대체 LLM 모두 실패(한도 초과 또는 일시 장애)
      content:
        application/json:
          schema:
            $ref: './openapi.yaml#/components/schemas/Error'
          example:
            code: llm_unavailable
            message: 증상 분석이 잠시 어렵습니다. 잠시 후 다시 시도해 주세요.
  schemas:
    PredictRequest:
      type: object
      required: [symptoms]
      additionalProperties: false
      properties:
        symptoms:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: './openapi.yaml#/components/schemas/SymptomObservation'
        top_k:
          type: integer
          minimum: 1
          maximum: 10
          default: 3

    PredictResponse:
      type: object
      required: [model_version, predictions, unknown_symptom_ids]
      properties:
        model_version:
          type: string
          description: 예 `baseline-2026.11.0`, `klue-roberta-2026.12.1`
        predictions:
          type: array
          minItems: 1
          maxItems: 10
          description: 확률 내림차순
          items:
            type: object
            required: [disease_id, probability]
            properties:
              disease_id:
                $ref: './openapi.yaml#/components/schemas/DiseaseId'
              probability:
                type: number
                minimum: 0
                maximum: 1
        unknown_symptom_ids:
          type: array
          description: 모델이 모르는 증상 ID(예측에서 무시함). 사전 누락을 찾는 데 씁니다.
          items:
            $ref: './openapi.yaml#/components/schemas/SymptomId'

    ExtractRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: 사용자의 자연어 증상. 처리에만 쓰고 저장·로그하지 않습니다.

    ExtractResponse:
      type: object
      required: [symptoms, emergency_suspected, emergency_reason, model]
      properties:
        symptoms:
          type: array
          maxItems: 30
          items:
            $ref: './openapi.yaml#/components/schemas/SymptomObservation'
        emergency_suspected:
          type: boolean
        emergency_reason:
          type: [string, 'null']
        model:
          type: string
          description: 실제로 응답한 모델(기본 또는 대체)

    QuestionsRequest:
      type: object
      required: [symptom_ids]
      additionalProperties: false
      properties:
        symptom_ids:
          type: array
          maxItems: 30
          items:
            $ref: './openapi.yaml#/components/schemas/SymptomId'

    QuestionsResponse:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          maxItems: 3
          items:
            $ref: './openapi.yaml#/components/schemas/FollowUpQuestion'

    ExplainRequest:
      type: object
      required: [disease_names, symptom_ids]
      additionalProperties: false
      properties:
        disease_names:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        symptom_ids:
          type: array
          maxItems: 30
          items:
            $ref: './openapi.yaml#/components/schemas/SymptomId'
        emergency:
          type: boolean
          default: false
          description: >-
            true이면 설명은 119 연락이나 가까운 응급실 방문만 안내하고, 일반 병원·의원 방문은 권하지 않습니다.
            (T30 후속 C-3, 추가 필드라 하위 호환)

    ExplainResponse:
      type: object
      required: [explanation]
      properties:
        explanation:
          type: string

    SafetyRequest:
      type: object
      required: [symptoms]
      additionalProperties: false
      properties:
        symptoms:
          type: array
          maxItems: 30
          items:
            $ref: './openapi.yaml#/components/schemas/SymptomObservation'

    SafetyResponse:
      type: object
      required: [is_emergency, reasons, rule_ids]
      properties:
        is_emergency:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        rule_ids:
          type: array
          items:
            type: string

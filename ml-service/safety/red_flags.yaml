# 위급 신호 규칙 (T15). LLM 판정과 OR로 묶습니다(SPEC 6절): 둘 중 하나라도 걸리면 응급 안내.
# 원칙: 놓치는 것보다 과잉 경고가 낫습니다(SPEC 1절 성공 기준: 위급 케이스 재현율 100%).
#
# 규칙 형식: 비어 있지 않은 조건을 모두 만족하면 발동합니다.
#   any_of     : 이 중 하나라도 있으면
#   all_of     : 모두 있어야
#   with_any   : all_of와 함께, 이 중 하나라도 있어야
#   severe_any : 이 중 하나가 severity=severe로 있으면
# 증상 ID는 data/mappings/symptoms.csv와 같습니다. 위험 요인 3종은 쓰지 않습니다.
#
# 출처 검수: 아래 법령 항목명은 이 세션에서 law.go.kr에 접근할 수 없어 원문과 대조하지 못했습니다(review_status: draft).
# 원문을 확인한 뒤 review_status를 reviewed로 바꾸세요. 회귀 테스트: ml-service/safety/cases.yaml

version: 1
review_status: draft
sources:
  law_annex1:
    title: 응급의료에 관한 법률 시행규칙 [별표 1] 응급증상 및 이에 준하는 증상 (제2조제1호 관련)
    url: https://www.law.go.kr/법령/응급의료에관한법률시행규칙

rules:
  - id: altered_consciousness
    any_of: [coma, altered_sensorium]
    reason_ko: 의식이 없거나 흐려진 상태입니다.
    source: law_annex1 / 신경학적 응급증상 - 급성의식장애

  - id: stroke_signs
    any_of: [weakness_of_one_body_side, slurred_speech]
    reason_ko: 한쪽 팔다리에 힘이 빠지거나 말이 어눌한 것은 뇌졸중 신호일 수 있습니다.
    source: law_annex1 / 신경학적 응급증상 - 급성신경학적 이상

  - id: chest_pain
    any_of: [chest_pain]
    reason_ko: 가슴 통증이 있습니다. 증상만으로는 심장 원인을 배제할 수 없습니다.
    source: law_annex1 / 심혈관계 응급증상 - 심장질환으로 인한 급성 흉통 (원인을 가릴 수 없어 흉통 단독도 응급으로 봄, SPEC 1절 과잉 경고 원칙)

  - id: severe_breathlessness
    severe_any: [breathlessness]
    reason_ko: 숨쉬기가 매우 힘든 상태입니다.
    source: law_annex1 / 심혈관계 응급증상 - 급성호흡곤란

  - id: hemoptysis
    any_of: [blood_in_sputum]
    reason_ko: 가래에 피가 섞여 나옵니다.
    source: law_annex1 / 출혈 - 계속되는 각혈

  - id: gi_bleeding
    any_of: [stomach_bleeding]
    reason_ko: 피를 토하거나 위장관 출혈이 의심됩니다.
    source: law_annex1 / 출혈 - 급성 위장관 출혈

  - id: bloody_stool_with_shock_signs
    all_of: [bloody_stool]
    with_any: [dizziness, fast_heart_rate, altered_sensorium, sweating]
    reason_ko: 혈변과 함께 어지럼이나 빠른 맥박이 있습니다.
    source: law_annex1 / 출혈 - 급성 위장관 출혈

  - id: severe_dehydration
    severe_any: [dehydration]
    reason_ko: 탈수가 심합니다.
    source: law_annex1 / 중독 및 대사장애 - 심한 탈수

  - id: acute_liver_failure
    any_of: [acute_liver_failure]
    reason_ko: 급성 간부전이 의심됩니다.
    source: law_annex1 / 중독 및 대사장애 - 급성대사장애(간부전)

  - id: allergic_face_swelling
    all_of: [puffy_face_and_eyes]
    with_any: [skin_rash, itching, breathlessness, red_spots_over_body]
    reason_ko: 얼굴이 붓고 발진이나 가려움, 호흡곤란이 함께 있습니다.
    source: law_annex1 / 알러지 - 얼굴 부종을 동반한 알러지 반응

  - id: sudden_vision_loss
    severe_any: [visual_disturbances, blurred_and_distorted_vision]
    reason_ko: 갑자기 앞이 잘 보이지 않습니다.
    source: law_annex1 / 안과적 응급증상 - 급성 시력 손실

  - id: acute_abdomen
    severe_any: [abdominal_pain, stomach_pain, belly_pain]
    reason_ko: 배가 매우 심하게 아픕니다.
    source: law_annex1 / 외과적 응급증상 - 급성복증
